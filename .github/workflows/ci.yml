name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version from `engines.node`, current LTS, and current.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Fails if the lockfile is out of date rather than silently updating it.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      # Zero runtime dependencies is a package invariant, not a preference.
      - name: Assert no runtime dependencies
        run: |
          deps=$(node -p "JSON.stringify(require('./package.json').dependencies ?? {})")
          if [ "$deps" != "{}" ]; then
            echo "Expected zero runtime dependencies, found: $deps" >&2
            exit 1
          fi

      # Verifies the published tarball resolves its own entry points, which
      # `pnpm test` (running against src) cannot catch.
      - name: Verify package contents
        run: |
          pnpm pack
          tar -tzf async-state-engine-*.tgz | sort
          pnpm publish --dry-run --no-git-checks
